[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
markers =
    unit: fast, offline unit tests
    api: FastAPI route and request/response contract tests
    integration: hits real LLM / DB / network (set RUN_INTEGRATION=1)
    live_env: validates real deployment secrets (set RUN_LIVE_ENV=1)
    slow: long-running evaluation cases
filterwarnings =
    ignore::DeprecationWarning
