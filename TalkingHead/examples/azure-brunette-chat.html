<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talking Head - Brunette + Azure TTS</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #202020;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #avatar {
            position: absolute;
            inset: 0;
        }

        #panel {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            max-width: 960px;
            margin: 0 auto;
            padding: 12px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(2px);
            z-index: 10;
        }

        .row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        input,
        textarea,
        button {
            font-size: 14px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #555;
            box-sizing: border-box;
        }

        input,
        textarea {
            background: #111;
            color: #fff;
            flex: 1;
            min-width: 180px;
        }

        textarea {
            width: 100%;
            min-height: 70px;
            resize: vertical;
        }

        button {
            cursor: pointer;
            background: #2a74ff;
            color: #fff;
            border: 0;
            min-width: 92px;
        }

        #status {
            font-size: 13px;
            color: #c7d7ff;
            min-height: 20px;
        }
    </style>

    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "../modules/talkinghead.mjs"
    }
  }
  </script>

    <script
        src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@latest/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>

    <script type="module">
        import { TalkingHead } from "talkinghead";

        const visemeMap = [
            "sil", "aa", "aa", "O", "E", "E", "I", "U", "O", "aa", "O", "I",
            "kk", "RR", "nn", "SS", "SS", "TH", "FF", "DD", "kk", "PP"
        ];

        let head = null;
        let synthesizer = null;
        let synthesizerRegion = "";
        let synthesizerKey = "";

        function setStatus(text) {
            document.getElementById("status").textContent = text;
        }

        function escapeXml(text) {
            return text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
        }

        function ensureSynthesizer() {
            const region = document.getElementById("azure-region").value.trim();
            const key = document.getElementById("azure-key").value.trim();

            if (!region || !key) {
                throw new Error("Azure region and API key are required.");
            }

            if (!synthesizer || region !== synthesizerRegion || key !== synthesizerKey) {
                if (synthesizer) {
                    synthesizer.close();
                    synthesizer = null;
                }
                const config = window.SpeechSDK.SpeechConfig.fromSubscription(key, region);
                config.speechSynthesisOutputFormat = window.SpeechSDK.SpeechSynthesisOutputFormat.Raw22050Hz16BitMonoPcm;
                config.setProperty(window.SpeechSDK.PropertyId.SpeechServiceResponse_RequestSentenceBoundary, "true");
                synthesizer = new window.SpeechSDK.SpeechSynthesizer(config, null);
                synthesizerRegion = region;
                synthesizerKey = key;
            }

            return synthesizer;
        }

        function speakAzure(text) {
            return new Promise((resolve, reject) => {
                try {
                    const synth = ensureSynthesizer();
                    const voice = document.getElementById("azure-voice").value.trim() || "en-US-JennyNeural";

                    const speak = {
                        audio: [], words: [], wtimes: [], wdurations: [],
                        visemes: [], vtimes: [], vdurations: [], markers: [], mtimes: []
                    };

                    synth.visemeReceived = function (_sender, ev) {
                        const viseme = visemeMap[ev.visemeId] || "sil";
                        const time = ev.audioOffset / 10000;
                        const len = speak.vdurations.length;
                        if (len > 0) {
                            speak.vdurations[len - 1] = time - speak.vtimes[len - 1];
                        }
                        speak.visemes.push(viseme);
                        speak.vtimes.push(time);
                        speak.vdurations.push(80);
                    };

                    synth.wordBoundary = function (_sender, ev) {
                        if (ev.boundaryType === "WordBoundary" || ev.boundaryType === "PunctuationBoundary") {
                            speak.words.push(ev.text);
                            speak.wtimes.push(ev.audioOffset / 10000);
                            speak.wdurations.push(ev.duration / 10000);
                        }
                    };

                    const ssml =
                        `<speak version='1.0' xmlns:mstts='http://www.w3.org/2001/mstts' xml:lang='en-US'>` +
                        `<voice name='${voice}'><mstts:viseme type='redlips_front'/>${escapeXml(text)}</voice></speak>`;

                    synth.speakSsmlAsync(
                        ssml,
                        function (result) {
                            if (result.reason === window.SpeechSDK.ResultReason.SynthesizingAudioCompleted) {
                                speak.audio.push(result.audioData);
                                resolve(speak);
                            } else {
                                reject(new Error("Azure TTS synthesis failed."));
                            }
                        },
                        function (err) {
                            reject(new Error(err));
                        }
                    );
                } catch (err) {
                    reject(err);
                }
            });
        }

        document.addEventListener("DOMContentLoaded", async function () {
            const nodeAvatar = document.getElementById("avatar");
            const nodeText = document.getElementById("text");
            const nodeSpeak = document.getElementById("speak");

            document.getElementById("azure-region").value = localStorage.getItem("azure_region") || "eastus";
            document.getElementById("azure-key").value = localStorage.getItem("azure_key") || "";
            document.getElementById("azure-voice").value = localStorage.getItem("azure_voice") || "en-US-JennyNeural";

            setStatus("Loading Brunette avatar...");
            head = new TalkingHead(nodeAvatar, {
                cameraView: "upper",
                lipsyncModules: ["en"]
            });

            try {
                await head.showAvatar({
                    url: "../avatars/brunette.glb",
                    body: "F",
                    avatarMood: "neutral",
                    lipsyncLang: "en"
                });
                setStatus("Ready. Enter text and press Speak.");
            } catch (error) {
                console.error(error);
                setStatus("Avatar load failed: " + error.message);
            }

            nodeSpeak.addEventListener("click", async function () {
                const text = nodeText.value.trim();
                if (!text || !head) {
                    return;
                }

                localStorage.setItem("azure_region", document.getElementById("azure-region").value.trim());
                localStorage.setItem("azure_key", document.getElementById("azure-key").value.trim());
                localStorage.setItem("azure_voice", document.getElementById("azure-voice").value.trim());

                nodeSpeak.disabled = true;
                setStatus("Synthesizing with Azure TTS...");

                try {
                    const speak = await speakAzure(text);
                    setStatus("Speaking...");
                    head.speakAudio(speak);
                    setStatus("Done.");
                } catch (error) {
                    console.error(error);
                    setStatus("Error: " + error.message);
                } finally {
                    nodeSpeak.disabled = false;
                }
            });

            nodeText.addEventListener("keydown", function (ev) {
                if (ev.key === "Enter" && !ev.shiftKey) {
                    ev.preventDefault();
                    nodeSpeak.click();
                }
            });

            document.addEventListener("visibilitychange", function () {
                if (!head) {
                    return;
                }
                if (document.visibilityState === "visible") {
                    head.start();
                } else {
                    head.stop();
                }
            });
        });
    </script>
</head>

<body>
    <div id="avatar"></div>

    <div id="panel">
        <div class="row">
            <input id="azure-region" type="text" placeholder="Azure region (e.g., eastus)">
            <input id="azure-key" type="password" placeholder="Azure Speech API key">
            <input id="azure-voice" type="text" placeholder="Azure voice (e.g., en-US-JennyNeural)">
        </div>
        <div class="row">
            <textarea id="text"
                placeholder="Type what Brunette should say...">Hello, I am Brunette. Nice to meet you!</textarea>
            <button id="speak">Speak</button>
        </div>
        <div id="status"></div>
    </div>
</body>

</html>
