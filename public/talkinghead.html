<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>MindMitra Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #avatar {
            display: block;
            width: 100%;
            height: 100%;
        }

        #status {
            display: none;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 4px 12px;
            border-radius: 9999px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            white-space: nowrap;
            z-index: 10;
        }

        #status.visible {
            display: block;
        }
    </style>

    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "/talkinghead/modules/talkinghead.mjs",
      "mindmitra-bridge": "/talkinghead/modules/mindmitra-bridge.mjs"
    }
  }
  </script>

    <script type="module">
        import { TalkingHead } from "talkinghead";
        import { MindMitraBridge } from "mindmitra-bridge";

        // -- Config: secrets via postMessage, public via URL --------------------------------
        // Security note: TTS API keys USED to be passed via URL search params,
        // which leaked them into:
        //   - browser history (visible in History UI / sync to other devices)
        //   - the Referer header on any third-party fetch made from this iframe
        //   - DevTools "Network" panel for anyone with brief device access
        //
        // The keys are now sent via `postMessage` from the React parent AFTER
        // the iframe loads. The URL only carries non-sensitive presentation
        // config (avatar model, voice name, BCP-47 language tag, camera
        // framing). `init()` is gated on receipt of the config message so
        // TalkingHead is constructed with the correct credentials on the
        // first frame — no race, no second init.
        const params = new URLSearchParams(window.location.search);
        let googleKey   = "";   // populated from postMessage("config")
        let azureKey    = "";   // populated from postMessage("config")
        let azureRegion = "eastasia";

        const ttsVoice   = params.get("ttsVoice")   || "en-IN-Neural2-A";
        const ttsLang    = params.get("ttsLang")    || "en-IN";
        const avatarUrl  = params.get("avatarUrl")  || "/talkinghead/avatars/brunette.glb";
        // Camera framing preset — supplied by the React wrapper. Defaults to "mid"
        // (legacy behavior) when absent. PresenceMode passes "upper" for a
        // bust-shot that fills the screen and reads as face-to-face.
        const cameraView = params.get("cameraView") || "mid";
        // When the React wrapper is composing the avatar over its own gradient
        // backdrop (Presence Mode), ask the document to be transparent so the
        // backdrop shows through and the seam between iframe + parent disappears.
        const transparent = params.get("transparent") === "1";

        // Table-driven Azure voice map keyed by BCP-47 prefix
        const AZURE_VOICE_TABLE = {
            "en-IN": "en-IN-NeerjaNeural",
            "en-US": "en-US-JennyNeural",
            "hi-IN": "hi-IN-SwaraNeural",
            "ja-JP": "ja-JP-NanamiNeural",
            "te-IN": "te-IN-ShrutiNeural",
            "kn-IN": "kn-IN-SapnaNeural",
            "ta-IN": "ta-IN-PallaviNeural",
        };

        function resolveAzureVoice(lang) {
            return AZURE_VOICE_TABLE[lang] || ttsVoice || "en-IN-NeerjaNeural";
        }

        // ── Oculus/Azure Viseme Mapping (Viseme ID 0-21 → TalkingHead strings) ──────────
        // Azure SDK emits visemeReceived events with IDs 0–21 per SAPI5 standard.
        // Map these to TalkingHead's viseme string format for proper lip-sync bypass.
        const AZURE_TO_OCULUS = {
            0: 'sil', 1: 'aa', 2: 'aa', 3: 'O', 4: 'E', 5: 'E', 6: 'I', 7: 'U',
            8: 'O', 9: 'U', 10: 'O', 11: 'aa', 12: 'I', 13: 'RR', 14: 'nn',
            15: 'SS', 16: 'CH', 17: 'TH', 18: 'FF', 19: 'DD', 20: 'kk', 21: 'PP'
        };

        // ── TTS endpoint selection ────────────────────────────────────────────────────────
        //
        // Google Cloud TTS v1beta1 supports `enableTimePointing` which makes TalkingHead
        // return REAL word timestamps (not estimated). This is the key to accurate lipsync:
        // each word's viseme window is anchored to the exact acoustic onset in the audio.
        //
        // When no Google key is provided, a sentinel endpoint + fetch interceptor is used.
        // TalkingHead runs text-based lipsync; Web Speech API handles audio.
        const GOOGLE_TTS_ENDPOINT = "https://texttospeech.googleapis.com/v1beta1/text:synthesize";
        const SENTINEL_ENDPOINT   = "https://eu-texttospeech.googleapis.com/v1beta1/text:synthesize";

        // These get set after the parent's `config` postMessage arrives.
        let ttsEndpoint = SENTINEL_ENDPOINT;
        let ttsApikey   = "";
        let TTS_MODE    = "pending-config";

        // ── Sentinel fetch interceptor ────────────────────────────────────
        // When the iframe ends up in webspeech-fallback mode, TalkingHead
        // still issues a fetch to its configured endpoint. We intercept the
        // sentinel URL and return an empty 200 so TH skips audio but keeps
        // its lipsync animation queue. Installed unconditionally — the
        // interceptor is a pure URL-prefix check and a no-op for any other
        // request, so it's safe even when Google is the active provider.
        (function installSentinelInterceptor() {
            const _origFetch = window.fetch.bind(window);
            window.fetch = async function patchedFetch(input, init) {
                const url = typeof input === "string" ? input : input?.url;
                if (url && url.startsWith(SENTINEL_ENDPOINT) && !googleKey) {
                    return new Response(
                        JSON.stringify({}),
                        { status: 200, headers: { "Content-Type": "application/json" } }
                    );
                }
                return _origFetch(input, init);
            };
        })();

        function recomputeTtsMode() {
            ttsEndpoint = googleKey ? GOOGLE_TTS_ENDPOINT : SENTINEL_ENDPOINT;
            ttsApikey   = googleKey ? googleKey           : "";
            TTS_MODE    = googleKey ? "google-cloud-tts"
                        : azureKey  ? "azure-tts"
                        :             "webspeech-fallback";
        }

        // ── Helpers ──────────────────────────────────────────────────────────────────────

        /**
         * Strip common Markdown formatting so TTS does not say symbols aloud.
         * e.g. "**bold**" → "bold", "# Heading" → "Heading"
         */
        function stripMarkdown(text) {
            return text
                .replace(/\*\*(.+?)\*\*/gs, "$1")       // **bold**
                .replace(/\*(.+?)\*/gs, "$1")            // *italic*
                .replace(/__(.+?)__/gs, "$1")            // __bold__
                .replace(/_(.+?)_/gs, "$1")              // _italic_
                .replace(/~~(.+?)~~/gs, "$1")            // ~~strikethrough~~
                .replace(/`{1,3}[^`]*`{1,3}/g, "")       // `code` / ```block```
                .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1") // [link](url)
                .replace(/^#+\s+/gm, "")                 // # Headings
                .replace(/^[-*+]\s+/gm, "")              // - bullet points
                .replace(/^\d+\.\s+/gm, "")              // 1. numbered lists
                .replace(/\n{3,}/g, "\n\n")              // collapse excess blank lines
                .trim();
        }

        /** Decode a base64 string (Google TTS audioContent) to an ArrayBuffer. */
        function b64ToArrayBuffer(b64) {
            const bin = atob(b64);
            const buf = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
            return buf.buffer;
        }

        /** XML-escape a word so it is safe inside an SSML <speak> element. */
        function escapeXml(t) {
            return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
        }

        /**
         * Make ONE Google TTS v1beta1 request for all words.
         * Returns { audioContent, timepoints, words } or null on error.
         *
         * SSML mark strategy:
         *   word0 <mark name='1'/> word1 <mark name='2'/> word2 …
         * Mark i fires at the acoustic ONSET of word i+1, so:
         *   wtimes[0] = 0
         *   wtimes[i] = timepoints[i-1].timeSeconds * 1000  (i > 0)
         */
        async function fetchGoogleTTS(words) {
            let ssml = "<speak>";
            words.forEach((w, i) => {
                if (i > 0) ssml += " <mark name='" + i + "'/> ";
                ssml += escapeXml(w);
            });
            ssml += "</speak>";

            // Map TalkingHead's internal encoding name to the Google API value.
            const encMap = { "OGG-OPUS": "OGG_OPUS", "MP3": "MP3" };
            const audioEncoding = encMap[head.ttsAudioEncoding] || "MP3";

            try {
                const resp = await fetch(
                    "https://texttospeech.googleapis.com/v1beta1/text:synthesize?key=" + googleKey,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json; charset=utf-8" },
                        body: JSON.stringify({
                            input: { ssml },
                            voice: { languageCode: ttsLang, name: ttsVoice },
                            audioConfig: { audioEncoding, speakingRate: 0.9, pitch: 2.0 },
                            enableTimePointing: [1]
                        })
                    }
                );
                if (!resp.ok) {
                    console.error("[MindMitra Avatar] Google TTS HTTP " + resp.status);
                    return null;
                }
                const data = await resp.json();
                return { audioContent: data.audioContent, timepoints: data.timepoints || [], words };
            } catch (err) {
                console.error("[MindMitra Avatar] Google TTS fetch error:", err);
                return null;
            }
        }

        /**
         * Convert Google TTS timepoints to TalkingHead's wtimes / wdurations arrays.
         * All values are in absolute milliseconds from the start of the audio buffer.
         *
         * wtimes[0]  = 0          (first word always starts at 0)
         * wtimes[i]  = timepoints[i-1].timeSeconds * 1000  (i > 0)
         * wdurations[i] = wtimes[i+1] − wtimes[i]  (last word fills to audioDurationMs)
         */
        function buildWordTimingsFromTimepoints(words, timepoints, audioDurationMs) {
            const wtimes = [];
            const wdurations = [];
            if (!timepoints || timepoints.length === 0) {
                // No real timestamps from TTS → distribute words evenly across the full
                // audio duration. This prevents all visemes collapsing to time 0,
                // which manifests as "no lipsync" (mouth moves only at the very start).
                const n = Math.max(words.length, 1);
                for (let i = 0; i < words.length; i++) {
                    wtimes.push(Math.round((i / n) * audioDurationMs));
                }
            } else {
                // Use SSML mark-based onset times returned by Google TTS.
                // Mark i fires at the acoustic onset of word i+1, so:
                //   wtimes[0] = 0, wtimes[i] = timepoints[i-1].timeSeconds * 1000
                for (let i = 0; i < words.length; i++) {
                    const tMs = i === 0 ? 0 : (timepoints[i - 1]?.timeSeconds || 0) * 1000;
                    wtimes.push(Math.round(tMs));
                }
            }
            for (let i = 0; i < words.length; i++) {
                const next = i + 1 < words.length ? wtimes[i + 1] : audioDurationMs;
                wdurations.push(Math.max(50, next - wtimes[i]));
            }
            return { words, wtimes, wdurations };
        }

        /**
         * Concatenate multiple Web Audio API AudioBuffers into a single seamless buffer.
         * All buffers must share the same sample rate (guaranteed when decoded by the
         * same AudioContext).  Channel mismatch is resolved by mapping to channel 0.
         *
         * Using ONE combined AudioBuffer + ONE speakAudio() call eliminates the mandatory
         * 500 ms break that TalkingHead inserts after every speakAudio() call,
         * giving the avatar continuous speech with unbroken lip-sync animation.
         */
        function concatAudioBuffers(audioCtx, buffers) {
            if (buffers.length === 1) return buffers[0];
            const nChannels = Math.max(...buffers.map(b => b.numberOfChannels));
            const sampleRate = buffers[0].sampleRate;
            const totalLength = buffers.reduce((sum, b) => sum + b.length, 0);
            const result = audioCtx.createBuffer(nChannels, totalLength, sampleRate);
            for (let ch = 0; ch < nChannels; ch++) {
                const out = result.getChannelData(ch);
                let offset = 0;
                for (const buf of buffers) {
                    // If buf has fewer channels use channel 0 for all
                    const chIdx = Math.min(ch, buf.numberOfChannels - 1);
                    out.set(buf.getChannelData(chIdx), offset);
                    offset += buf.length;
                }
            }
            return result;
        }

        // ── TalkingHead init ─────────────────────────────────────────────────────────────
        let head = null;        let bridge = null;        const statusEl = document.getElementById("status");

        function setStatus(msg) {
            statusEl.textContent = msg || "";
            statusEl.classList.toggle("visible", !!msg);
        }

        function postToParent(data) {
            // The iframe is same-origin (`/talkinghead.html`), so this is
            // safe to scope to our own origin instead of "*". Prevents
            // any future re-host of the iframe from leaking events to a
            // third-party document.
            window.parent.postMessage(data, window.location.origin);
        }

        // Tell the parent we're ready to RECEIVE the secret-bearing config.
        // The parent listens for { type: "needConfig" } and responds with
        // { type: "config", googleKey, azureKey, azureRegion }.
        postToParent({ type: "needConfig" });

        // ── Config gate ────────────────────────────────────────────────
        // `init()` cannot run until we know which TTS provider to use,
        // because TalkingHead's constructor takes the API key. We collect
        // the gate state here; both DOMContentLoaded and the config
        // message try to fire it. Whichever happens last wins.
        let _configReceived = false;
        let _domReady = false;
        async function maybeInit() {
            if (!_configReceived || !_domReady) return;
            recomputeTtsMode();
            console.info(
                `%c[MindMitra Avatar] Startup%c\n` +
                `  TTS mode    : ${TTS_MODE}\n` +
                `  Google key  : ${googleKey ? googleKey.slice(0,8) + "…(" + googleKey.length + " chars)" : "NOT SET"}\n` +
                `  Azure key   : ${azureKey ? azureKey.slice(0,8) + "…(" + azureKey.length + " chars)" : "NOT SET"}\n` +
                `  Azure region: ${azureRegion}\n` +
                `  Voice       : ${ttsVoice}\n` +
                `  Avatar URL  : ${avatarUrl}`,
                "background:#0d1117;color:#58c4dc;font-weight:bold",
                "background:#0d1117;color:#e2e8f0"
            );
            await init();
        }

        async function init() {
            setStatus("Loading avatar\u2026");
            console.info("[MindMitra Avatar] Loading model: " + avatarUrl);

            head = new TalkingHead(document.getElementById("avatar"), {
                // Real Google TTS endpoint when key is present → word timestamps → perfect lipsync.
                // Sentinel endpoint when absent → intercepted → empty response.
                ttsEndpoint: ttsEndpoint,
                ttsApikey:   ttsApikey,
                lipsyncModules: ["en"],
                cameraView: cameraView,
                avatarIdleEyeContact: 0.6,      // default 0.2 — hold gaze 60% of idle/listening time
                avatarSpeakingEyeContact: 0.85, // default 0.5 — hold gaze 85% while speaking
            });

            // Transparent canvas / page background so the React wrapper's
            // backdrop (sage gradient in Presence Mode) bleeds through
            // continuously. Applied AFTER TalkingHead init so the renderer
            // has already created the canvas.
            if (transparent) {
                document.documentElement.style.background = "transparent";
                document.body.style.background = "transparent";
                const stage = document.getElementById("avatar");
                if (stage) stage.style.background = "transparent";
                try {
                    if (head?.renderer) {
                        head.renderer.setClearColor(0x000000, 0);
                        head.renderer.setClearAlpha?.(0);
                    }
                    if (head?.scene) head.scene.background = null;
                } catch (e) {
                    console.warn("[MindMitra Avatar] transparent renderer setup failed", e);
                }
            }

            try {
                await head.showAvatar(
                    {
                        url: avatarUrl,
                        body: "F",
                        avatarMood: "neutral",
                        ttsLang:  ttsLang,
                        ttsVoice: ttsVoice,
                        // ttsRate maps to Google speakingRate (0.25–4.0). 0.9 = slightly slower.
                        ttsRate:  0.9,
                        // ttsPitch maps to Google pitch in semitones (-20 to +20). +2 = gentle warmth.
                        ttsPitch: 2,
                        lipsyncLang: "en",
                    },
                    (ev) => {
                        if (ev.lengthComputable) {
                            const pct = Math.min(100, Math.round((ev.loaded / ev.total) * 100));
                            setStatus("Loading " + pct + "%");
                        }
                    }
                );
                setStatus(null);

                // Initialize MindMitra Bridge — injects 6 therapeutic moods + per-frame hook.
                // This does NOT alter TalkingHead’s lip-sync pipeline. It only adds:
                //   • Upper-face expression control (brows, eyes, cheeks) via custom moods
                //   • Therapeutic gesture support (nods, lean-forward, tilt)
                //   • Amplitude-based jaw boost (dormant until audio data is passed)
                // Lip sync continues to be driven entirely by TalkingHead’s viseme engine.
                bridge = new MindMitraBridge(head);
                bridge.init();

                console.info("[MindMitra Avatar] ✅ Avatar ready — TTS mode: " + TTS_MODE + ", Bridge: active");
                postToParent({ type: "ready" });

                // Log TTS fallback status
                if (!googleKey && azureKey) console.info("[MindMitra Avatar] Azure TTS fallback ready");
                else if (!googleKey) console.info("[MindMitra Avatar] Web Speech API fallback (no TTS keys)");
            } catch (err) {
                console.error("[MindMitra Avatar] ❌ Avatar load error:", err);
                setStatus("Failed to load avatar");
                postToParent({ type: "error", message: err.toString() });
            }
        }

        // ── Web Speech API fallback (used when no Google key) ───────────────────────────
        function speakWithWebSpeech(text) {
            if (!window.speechSynthesis) return false;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang  = ttsLang || "en-IN";
            utter.rate  = 0.9;
            utter.pitch = 1.05;
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v =>
                v.lang.startsWith("en") && /female|woman|zira|emma|aria|susan|hazel|karen/i.test(v.name)
            ) || voices.find(v => v.lang.startsWith("en"));
            if (femaleVoice) utter.voice = femaleVoice;
            const finish = () => {
                clearSpeakEndPoll();
                try {
                    if (bridge) bridge.onAvatarFinishedSpeaking();
                } catch (e) { /* noop */ }
                postToParent({ type: "speakingEnd" });
            };
            utter.onend   = finish;
            utter.onerror = finish;
            window.speechSynthesis.speak(utter);
            return true;
        }

        /** Match enqueueSpeakAudio: neutral mouth before text-driven / Web Speech paths. */
        function neutralMoodForLipSync() {
            try {
                if (head && typeof head.setMood === "function") head.setMood("neutral");
            } catch (e) { /* noop */ }
        }

        // ── Resume AudioContext on first user interaction (browser autoplay policy) ──────
        let audioResumed = false;
        async function ensureAudioCtx() {
            if (audioResumed) return;
            if (head?.audioCtx?.state === "suspended") {
                try { await head.audioCtx.resume(); audioResumed = true; } catch { /* noop */ }
            }
        }
        document.addEventListener("click",       ensureAudioCtx);
        document.addEventListener("pointerdown", ensureAudioCtx);

        // ── Azure Speech SDK — lazy loader ───────────────────────────────────────────────
        // The SDK bundle (~2 MB) is loaded on-demand the first time TTS is needed.
        // Subsequent calls reuse the same cached promise so the SDK is fetched only once.
        let _sdkPromise = null;
        function loadAzureSDK() {
            if (!_sdkPromise) {
                _sdkPromise = new Promise((resolve, reject) => {
                    if (window.SpeechSDK) { resolve(window.SpeechSDK); return; }
                    const s = document.createElement('script');
                    s.src = 'https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.48.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle.js';
                    s.onload  = () => window.SpeechSDK
                        ? resolve(window.SpeechSDK)
                        : reject(new Error('SpeechSDK global not found after load'));
                    s.onerror = () => reject(new Error('Failed to load Azure Speech SDK from CDN'));
                    document.head.appendChild(s);
                });
            }
            return _sdkPromise;
        }

        // ── Azure Speech SDK synthesis with real word-boundary timestamps ─────────────────
        //
        // This is the PRIMARY Azure TTS path.  The SDK fires wordBoundary events during
        // synthesis with exact audioOffset (100-nanosecond ticks) for each word.
        // These map directly to TalkingHead wtimes, anchoring lipsync to the real
        // phoneme positions in the audio — far more accurate than the linear estimation
        // the REST API requires.
        //
        // Returns { audioData: ArrayBuffer, wordBoundaries: [{text, audioOffset, duration}] }
        function synthesizeWithAzureSDK(SpeechSDK, text) {
            return new Promise((resolve, reject) => {
                const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(azureKey, azureRegion);

                // MP3 @ 24 kHz 96 kbps — universally decodable via AudioContext.decodeAudioData
                speechConfig.speechSynthesisOutputFormat =
                    SpeechSDK.SpeechSynthesisOutputFormat.Audio24Khz96KBitRateMonoMp3;

                speechConfig.speechSynthesisVoiceName = resolveAzureVoice(ttsLang);

                // null audioConfig → synthesizer captures audio internally (no speaker output).
                // The full audio is returned in result.audioData as an ArrayBuffer.
                const synthesizer = new SpeechSDK.SpeechSynthesizer(speechConfig, null);

                const wordBoundaries = [];
                const azureVisemes = [];

                synthesizer.wordBoundary = (sender, event) => {
                    // Filter to actual word boundaries only (skip punctuation / sentence markers).
                    // SpeechSynthesisBoundaryType.Word === 0 in SDK v1.20+; fall back to
                    // a regex guard for older bundles that lack the enum.
                    const isWord = SpeechSDK.SpeechSynthesisBoundaryType
                        ? event.boundaryType === SpeechSDK.SpeechSynthesisBoundaryType.Word
                        : /\w/.test(event.text);
                    if (isWord && event.text) {
                        wordBoundaries.push({
                            text:        event.text,
                            audioOffset: event.audioOffset,    // 100-nanosecond ticks from audio start
                            duration:    event.duration || 0,  // 100-nanosecond ticks (0 in old SDKs)
                        });
                    }
                };

                synthesizer.visemeReceived = (sender, event) => {
                    if (event.visemeId !== undefined) {
                        azureVisemes.push({
                            visemeId: event.visemeId,
                            audioOffset: event.audioOffset,
                        });
                    }
                };

                synthesizer.speakTextAsync(
                    text,
                    result => {
                        synthesizer.close();
                        if (result.errorDetails) {
                            reject(new Error('[Azure SDK] Synthesis error: ' + result.errorDetails));
                        } else if (!result.audioData || result.audioData.byteLength === 0) {
                            reject(new Error('[Azure SDK] Synthesis returned empty audio'));
                        } else {
                            console.log("[MindMitra Avatar] Azure SDK ✔ synthesised "
                                + Math.round(result.audioData.byteLength / 1024) + " KB audio, "
                                + wordBoundaries.length + " word boundaries, "
                                + azureVisemes.length + " visemes");
                            resolve({ audioData: result.audioData, wordBoundaries, azureVisemes });
                        }
                    },
                    error => {
                        synthesizer.close();
                        reject(new Error('[Azure SDK] ' + error));
                    }
                );
            });
        }

        // ── Azure TTS — REST API fallback (used when SDK fails or SDK load fails) ──────────
        // Returns audio as ArrayBuffer; word timings are estimated from total audio duration
        // (Azure REST API does not expose word boundary events — those require the JS SDK).
        async function fetchAzureTTS(words) {
            const text = words.join(" ");
            // Build SSML — Azure requires <voice> element with exact voice name
            const azureVoice = resolveAzureVoice(ttsLang);
            const ssml = `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="${ttsLang}">` +
                         `<voice name="${azureVoice}">` +
                         `<prosody rate="-10%" pitch="+5%">${escapeXml(text)}</prosody>` +
                         `</voice></speak>`;

            try {
                const resp = await fetch(
                    `https://${azureRegion}.tts.speech.microsoft.com/cognitiveservices/v1`,
                    {
                        method: "POST",
                        headers: {
                            "Ocp-Apim-Subscription-Key": azureKey,
                            "Content-Type": "application/ssml+xml",
                            "X-Microsoft-OutputFormat": "audio-24khz-96kbitrate-mono-mp3",
                        },
                        body: ssml,
                    }
                );
                if (!resp.ok) {
                    console.error("[MindMitra Avatar] Azure TTS HTTP " + resp.status);
                    return null;
                }
                const arrayBuffer = await resp.arrayBuffer();
                return { audioBuffer: arrayBuffer, words };
            } catch (err) {
                console.error("[MindMitra Avatar] Azure TTS fetch error:", err);
                return null;
            }
        }

        // ── Speech-end detection poll ────────────────────────────────────────────────────
        let speakEndPoll = null;

        function clearSpeakEndPoll() {
            if (speakEndPoll !== null) { clearInterval(speakEndPoll); speakEndPoll = null; }
        }

        function startSpeakEndPoll() {
            clearSpeakEndPoll();
            let ticks = 0;
            speakEndPoll = setInterval(() => {
                ticks++;
                if (ticks > 3 && !head.isSpeaking && head.speechQueue.length === 0) {
                    clearSpeakEndPoll();
                    if (bridge) bridge.onAvatarFinishedSpeaking();
                    postToParent({ type: "speakingEnd" });
                }
            }, 250);
        }

        // ── Sentence splitter ────────────────────────────────────────────────────────────
        // Splits text into sentence-level chunks for parallel TTS fetching.
        // Handles common abbreviations to avoid false sentence splits.
        function splitIntoSentences(text) {
            // Locale-aware split: Latin (.!?), Japanese (。！？), Indic danda (।)
            const raw = text.match(/[^.!?。！？।]+(?:[.!?。！？।]+(?:\s|$)|$)/g) || [text];
            return raw.map(s => s.trim()).filter(s => s.length > 1);
        }

        const _CJK_RE = /[\u3000-\u9FFF\u3040-\u309F\u30A0-\u30FF]/;

        function tokenizeForTTS(text) {
            if (_CJK_RE.test(text)) {
                return [...text].filter(c => c.trim().length > 0);
            }
            return text.split(/\s+/).filter(w => w.length > 0);
        }

        /**
         * If the native TTS pipeline (Google or Azure REST) provides valid audio and word durations
         * but NO visemes, TalkingHead falls back to its local English-only parser.
         * This parser drops non-latin characters (Hindi, Japanese), generating zero visemes, leaving
         * the avatar's mouth completely frozen.
         * 
         * This function catches that edge case and populates synthetic 'open' (aa) and 'closed' (sil)
         * viseme keyframes based entirely on the provided word durations, ensuring the mouth animates
         * continuously regardless of language.
         */
        function addSyntheticVisemesIfNeeded(config) {
            if (config.visemes && config.visemes.length > 0) return config;
            
            if (config.wtimes && config.wdurations && config.wtimes.length > 0) {
                const vtimes = [];
                const vdurations = [];
                const visemes = [];
                for (let i = 0; i < config.wtimes.length; i++) {
                    const wt = config.wtimes[i];
                    const wd = config.wdurations[i];
                    // At the start of the word, open mouth
                    vtimes.push(wt);
                    vdurations.push(wd * 0.8);
                    visemes.push('aa');
                    
                    // Close mouth briefly between words
                    vtimes.push(wt + (wd * 0.8));
                    vdurations.push(wd * 0.2);
                    visemes.push('sil');
                }
                config.visemes = visemes;
                config.vtimes = vtimes;
                config.vdurations = vdurations;
            }
            return config;
        }

        /**
         * Single entry for all speakAudio calls (met4citizen/TalkingHead README):
         * - speakAudio(opt) with isRaw skips queued breaks/eye-contact that can skew timing.
         * - Built-in neutral mood clears mouth morphs from MindMitra therapeutic moods so
         *   Oculus viseme phoneme tracks are not blended with a smiling/puckered baseline.
         * - bridge.onAvatarStartSpeaking + decoded AudioBuffer enables amplitude jaw assist
         *   and state === "speaking" in MindMitraBridge._perFrameUpdate.
         */
        function enqueueSpeakAudio(audioPayload, decodedForBridge, fullTextForCue) {
            const payload = addSyntheticVisemesIfNeeded(audioPayload);
            try {
                if (head && typeof head.setMood === "function") {
                    head.setMood("neutral");
                }
            } catch (e) { /* noop */ }
            if (bridge && decodedForBridge) {
                try {
                    const cue = [{ text: (fullTextForCue && fullTextForCue.trim()) ? fullTextForCue : " ", emotion: "neutral" }];
                    bridge.onAvatarStartSpeaking(cue, decodedForBridge);
                } catch (e) {
                    console.warn("[MindMitra Avatar] bridge.onAvatarStartSpeaking:", e);
                }
            }
            head.speakAudio(payload, { isRaw: true });
        }

        // ── Parallel TTS fetch + audio concatenation ─────────────────────────────────────
        //
        // KEY DESIGN PRINCIPLE:
        //   TalkingHead.speakAudio() appends a mandatory { break: 500 } entry after every
        //   call (talkinghead.mjs line 3390).  Calling it N times for N sentences creates
        //   N × 500 ms of silence INSIDE the speech, making the avatar appear to stop
        //   lip-syncing between sentences.
        //
        //   Fix: fire all TTS requests in parallel → collect decoded AudioBuffers →
        //   concatenate into ONE buffer with cumulative word-timing offsets →
        //   call speakAudio EXACTLY ONCE.  Result: seamless, gap-free audio with
        //   correct continuous lip-sync across the entire message.
        async function speakSentencesParallel(sentences) {
            if (!sentences || sentences.length === 0) return false;
            const cleanSentences = sentences
                .map(s => stripMarkdown(s).trim())
                .filter(s => s.length > 1);
            if (cleanSentences.length === 0) return false;

            const joinedForBridge = cleanSentences.join(" ");

            if (googleKey) {
                // ── Google TTS path ───────────────────────────────────────────────────────
                // Fire all TTS fetches in parallel (each sentence = one SSML request
                // with mark-based word timing).
                const ttsPromises = cleanSentences.map(s => {
                    return fetchGoogleTTS(tokenizeForTTS(s));
                });

                const audioBuffers = [];
                const allWords     = [];
                const allWtimes    = [];
                const allWdurations = [];
                let cumulativeMs = 0;

                for (let i = 0; i < ttsPromises.length; i++) {
                    let result;
                    try { result = await ttsPromises[i]; } catch (e) { result = null; }
                    if (!result) continue;
                    try {
                        const arraybuf = b64ToArrayBuffer(result.audioContent);
                        const audioBuf = await head.audioCtx.decodeAudioData(arraybuf);
                        const durationMs = audioBuf.duration * 1000;
                        const { words, wtimes, wdurations } = buildWordTimingsFromTimepoints(
                            result.words, result.timepoints, durationMs
                        );
                        // Shift this sentence's timings by the cumulative duration so far.
                        for (let j = 0; j < words.length; j++) {
                            allWords.push(words[j]);
                            allWtimes.push(wtimes[j] + cumulativeMs);
                            allWdurations.push(wdurations[j]);
                        }
                        audioBuffers.push(audioBuf);
                        cumulativeMs += durationMs;
                        console.log("[MindMitra Avatar] Google TTS ▶ sentence " + (i+1) + "/"
                            + cleanSentences.length + " — " + words.length + " words, "
                            + audioBuf.duration.toFixed(2) + "s, offset " + Math.round(cumulativeMs - durationMs) + "ms");
                    } catch (decodeErr) {
                        console.warn("[MindMitra Avatar] Google TTS decode failed sentence " + i, decodeErr);
                    }
                }

                if (audioBuffers.length > 0) {
                    // ONE concatenated AudioBuffer → ONE speakAudio → no inter-sentence gaps.
                    const combined = concatAudioBuffers(head.audioCtx, audioBuffers);
                    console.log("[MindMitra Avatar] Google TTS ✔ combined " + audioBuffers.length
                        + " sentence(s), total " + combined.duration.toFixed(2) + "s, "
                        + allWords.length + " words");
                    enqueueSpeakAudio(
                        { audio: combined, words: allWords, wtimes: allWtimes, wdurations: allWdurations },
                        combined,
                        joinedForBridge
                    );
                    postToParent({ type: "speakingStart" });
                    startSpeakEndPoll();
                } else {
                    // All TTS fetches failed — sentinel speakText (viseme lipsync) + Web Speech audio.
                    console.warn("[MindMitra Avatar] Google TTS: all fetches failed — speakText + Web Speech");
                    neutralMoodForLipSync();
                    head.speakText(joinedForBridge);
                    speakWithWebSpeech(joinedForBridge);
                    postToParent({ type: "speakingStart" });
                }
                return true;

            } else if (azureKey) {
                // ── Azure Speech SDK path (primary) ───────────────────────────────────────
                //
                // Strategy: join ALL sentences into one text → ONE SDK synthesis call →
                // real wordBoundary events → exact per-word lipsync timing →
                // ONE speakAudio call → continuous audio, no gaps.
                //
                // Falls back to the REST API + estimated timings if the SDK fails.
                const fullText = cleanSentences.join(' ');

                let sdkSuccess = false;
                try {
                    const SpeechSDK = await loadAzureSDK();
                    const { audioData, wordBoundaries, azureVisemes } = await synthesizeWithAzureSDK(SpeechSDK, fullText);

                    // audioData is an ArrayBuffer returned by the SDK — decode it.
                    const audioBuf = await head.audioCtx.decodeAudioData(audioData);
                    const durationMs = audioBuf.duration * 1000;

                    // Convert SDK word boundaries (100-ns ticks) to TalkingHead wtimes/wdurations.
                    // audioOffset / 10 000 = milliseconds from audio start.
                    const sdkWords    = [];
                    const sdkWtimes   = [];
                    const sdkWdurs    = [];
                    for (let i = 0; i < wordBoundaries.length; i++) {
                        const wb = wordBoundaries[i];
                        sdkWords.push(wb.text);
                        sdkWtimes.push(wb.audioOffset / 10000);  // 100-ns → ms
                        // Prefer the SDK's own duration; fall back to gap-to-next-word.
                        const nextOffsetMs = i + 1 < wordBoundaries.length
                            ? wordBoundaries[i + 1].audioOffset / 10000
                            : durationMs;
                        const durMs = wb.duration > 0
                            ? wb.duration / 10000
                            : nextOffsetMs - sdkWtimes[i];
                        sdkWdurs.push(Math.max(50, durMs));
                    }

                    // Convert SDK Visemes to TalkingHead vtimes/vdurations format
                    const sdkVisemes  = [];
                    const sdkVtimes   = [];
                    const sdkVdurs    = [];
                    if (azureVisemes && azureVisemes.length > 0) {
                        for (let i = 0; i < azureVisemes.length; i++) {
                            const v = azureVisemes[i];
                            const oculusViseme = AZURE_TO_OCULUS[v.visemeId] || 'sil';
                            sdkVisemes.push(oculusViseme);
                            sdkVtimes.push(v.audioOffset / 10000); // 100-ns to ms
                            
                            const nextVOffsetMs = (i + 1 < azureVisemes.length) 
                                ? azureVisemes[i + 1].audioOffset / 10000 
                                : durationMs;
                            
                            // Azure issues extremely fast consecutive visemes occasionally, floor at 20ms
                            sdkVdurs.push(Math.max(20, nextVOffsetMs - (v.audioOffset / 10000)));
                        }
                    }

                    if (sdkWords.length > 0) {
                        const audioConfig = { audio: audioBuf, words: sdkWords, wtimes: sdkWtimes, wdurations: sdkWdurs };
                        if (sdkVisemes.length > 0) {
                            audioConfig.visemes = sdkVisemes;
                            audioConfig.vtimes = sdkVtimes;
                            audioConfig.vdurations = sdkVdurs;
                        }
                        enqueueSpeakAudio(audioConfig, audioBuf, fullText);
                    } else {
                        // SDK returned no word boundaries — use evenly-distributed fallback.
                        console.warn("[MindMitra Avatar] Azure SDK: no word boundaries received, using even distribution");
                        const plainWords = tokenizeForTTS(fullText);
                        const { words: fw, wtimes: ft, wdurations: fd } = buildWordTimingsFromTimepoints(plainWords, [], durationMs);
                        enqueueSpeakAudio({ audio: audioBuf, words: fw, wtimes: ft, wdurations: fd }, audioBuf, fullText);
                    }
                    postToParent({ type: "speakingStart" });
                    startSpeakEndPoll();
                    sdkSuccess = true;
                } catch (sdkErr) {
                    console.warn("[MindMitra Avatar] Azure SDK failed — falling back to REST API:", sdkErr);
                }

                if (!sdkSuccess) {
                    // ── Azure REST API fallback ───────────────────────────────────────────
                    // Fetch all sentence audio in parallel, concatenate, call speakAudio once.
                    const ttsPromises = cleanSentences.map(s => {
                        return fetchAzureTTS(tokenizeForTTS(s));
                    });

                    const audioBuffers  = [];
                    const allWords      = [];
                    const allWtimes     = [];
                    const allWdurations = [];
                    let cumulativeMs    = 0;

                    for (let i = 0; i < ttsPromises.length; i++) {
                        let result;
                        try { result = await ttsPromises[i]; } catch (e) { result = null; }
                        if (!result) continue;
                        try {
                            const audioBuf   = await head.audioCtx.decodeAudioData(result.audioBuffer);
                            const durationMs = audioBuf.duration * 1000;
                            const sentWords  = tokenizeForTTS(cleanSentences[i]);
                            const n = Math.max(sentWords.length, 1);
                            for (let j = 0; j < sentWords.length; j++) {
                                const wStart = cumulativeMs + Math.round((j / n) * durationMs);
                                const wEnd   = j + 1 < sentWords.length
                                    ? cumulativeMs + Math.round(((j + 1) / n) * durationMs)
                                    : cumulativeMs + durationMs;
                                allWords.push(sentWords[j]);
                                allWtimes.push(wStart);
                                allWdurations.push(Math.max(50, wEnd - wStart));
                            }
                            audioBuffers.push(audioBuf);
                            cumulativeMs += durationMs;
                        } catch (decodeErr) {
                            console.warn("[MindMitra Avatar] Azure REST decode failed sentence " + i, decodeErr);
                        }
                    }

                    if (audioBuffers.length > 0) {
                        const combined = concatAudioBuffers(head.audioCtx, audioBuffers);
                        enqueueSpeakAudio(
                            { audio: combined, words: allWords, wtimes: allWtimes, wdurations: allWdurations },
                            combined,
                            joinedForBridge
                        );
                        postToParent({ type: "speakingStart" });
                        startSpeakEndPoll();
                    } else {
                        console.warn("[MindMitra Avatar] Azure REST: all fetches failed — speakText + Web Speech");
                        neutralMoodForLipSync();
                        head.speakText(fullText);
                        speakWithWebSpeech(fullText);
                        postToParent({ type: "speakingStart" });
                    }
                }
                return true;

            } else {
                // ── Web Speech API fallback ───────────────────────────────────────────────
                // No TTS key — TalkingHead runs text-based lipsync while Web Speech
                // provides the audio.  Join all sentences to avoid multiple cancel() calls.
                const joinedText = cleanSentences.join(' ');
                neutralMoodForLipSync();
                head.speakText(joinedText);
                const fireWebSpeech = () => speakWithWebSpeech(joinedText);
                if (window.speechSynthesis.getVoices().length === 0) {
                    window.speechSynthesis.addEventListener("voiceschanged", fireWebSpeech, { once: true });
                } else {
                    fireWebSpeech();
                }
                postToParent({ type: "speakingStart" });
                return true;
            }
        }

        // ── PostMessage bridge (React ↔ iframe) ──────────────────────────────────────────
        window.addEventListener("message", async (event) => {
            // Origin check — only accept messages from the page that hosts
            // us. Same-origin in production; stays loose in local dev where
            // event.origin can legitimately differ between localhost ports.
            if (event.origin !== window.location.origin && event.origin !== "null") {
                // "null" can occur during sandboxed dev contexts; tolerated.
                return;
            }

            const { type, text, mood } = event.data || {};

            // ── Config gate: keys arrive here, NOT in the URL ────────────
            // Parent posts { type:"config", googleKey, azureKey, azureRegion }
            // immediately after the iframe loads. We accept the message
            // exactly once; later config posts (e.g. user changed settings
            // mid-session) are ignored to avoid mid-flight TalkingHead
            // reconfiguration. Implement live key rotation as a separate
            // feature if/when needed.
            if (type === "config" && !_configReceived) {
                if (typeof event.data.googleKey === "string") googleKey = event.data.googleKey;
                if (typeof event.data.azureKey === "string") azureKey = event.data.azureKey;
                if (typeof event.data.azureRegion === "string" && event.data.azureRegion) {
                    azureRegion = event.data.azureRegion;
                }
                // Mirror the legacy precedence: if Azure is supplied, force
                // Google off so we don't flap between providers and trip a
                // 400 from the TTS API when both are set.
                if (azureKey) googleKey = "";
                _configReceived = true;
                maybeInit();
                return;
            }

            // Everything below requires the avatar to be initialised.
            if (!head) return;

            switch (type) {
                // ── speakTextStream: sentence-parallel TTS (primary path) ──────────────
                // Accepts an array of pre-split sentences.  All TTS requests fire in
                // parallel; audio is queued to TalkingHead in sentence order.
                case "speakTextStream": {
                    const sentences = event.data.sentences;
                    if (!sentences || sentences.length === 0) break;
                    console.log("[MindMitra Avatar] speakTextStream — " + sentences.length + " sentence(s) | TTS: " + TTS_MODE);
                    try {
                        await ensureAudioCtx();
                        clearSpeakEndPoll();
                        await speakSentencesParallel(sentences);
                    } catch (err) {
                        console.error("[MindMitra Avatar] ❌ speakTextStream error:", err);
                    }
                    break;
                }

                // ── speakText: legacy single-text path → auto-split into sentences ────
                case "speakText":
                    if (!text) break;
                    console.log("[MindMitra Avatar] speakText (" + text.length + " chars) | TTS: " + TTS_MODE);
                    try {
                        await ensureAudioCtx();
                        clearSpeakEndPoll();
                        // Split into sentences and use parallel TTS for zero inter-sentence gaps
                        const sentences = splitIntoSentences(text);
                        await speakSentencesParallel(sentences);
                    } catch (err) {
                        console.error("[MindMitra Avatar] ❌ speakText error:", err);
                    }
                    break;

                case "stopSpeaking":
                    console.log("[MindMitra Avatar] stopSpeaking");
                    clearSpeakEndPoll();
                    if (!googleKey && window.speechSynthesis) window.speechSynthesis.cancel();
                    try { head.stopSpeaking(); } catch { /* noop */ }
                    if (bridge) bridge.onAvatarFinishedSpeaking();
                    postToParent({ type: "speakingEnd" });
                    break;

                case "setMood":
                    if (mood) {
                        console.log("[MindMitra Avatar] setMood → " + mood);
                        // Prefer bridge for intensity scaling if available
                        if (bridge) {
                            bridge.setEmotion(mood, null);
                        } else {
                            try { head.setMood(mood); } catch { /* noop */ }
                        }
                    }
                    break;

                case "setEmotion": {
                    const emo = event.data.emotion || "neutral";
                    const inten = event.data.intensity || null;
                    if (bridge) {
                        console.log("[MindMitra Avatar] setEmotion → " + emo + (inten ? " ×" + inten : ""));
                        bridge.setEmotion(emo, inten);
                    } else {
                        try { head.setMood(emo); } catch { head.setMood("neutral"); }
                    }
                    break;
                }

                case "triggerGesture": {
                    const g = event.data.gesture;
                    if (bridge && g) {
                        console.log("[MindMitra Avatar] triggerGesture → " + g);
                        bridge.triggerGesture(g);
                    }
                    break;
                }

                case "pause":
                    try { head.stop(); } catch { /* noop */ }
                    break;

                case "resume":
                    try { head.start(); } catch { /* noop */ }
                    break;
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (!head) return;
            document.visibilityState === "visible" ? head.start() : head.stop();
        });

        document.addEventListener("DOMContentLoaded", () => {
            _domReady = true;
            // Re-announce we need config — handles the case where the parent
            // attached its listener AFTER our initial postToParent above
            // (iframe `load` event timing race).
            postToParent({ type: "needConfig" });
            maybeInit();
        });
    </script>
</head>

<body>
    <div id="avatar"></div>
    <div id="status"></div>
</body>

</html>
