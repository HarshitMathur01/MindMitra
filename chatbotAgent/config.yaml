# MindMitra backend runtime configuration.
#
# Keep secrets in environment variables. This file is for non-secret behavior:
# model names, timeouts, feature flags, CORS origins, collection names, and
# budgets. Environment variables with the legacy names still override these
# values for tests and emergency deploy changes.

app:
  environment: "development"
  mha_v3_enabled: true

server:
  cors_allow_origins:
    - "https://mindmitra.co.in"
    - "https://www.mindmitra.co.in"
    - "https://mindmitra-seven.vercel.app"
    - "http://localhost:8080"
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:8001"
    - "http://127.0.0.1:8000"
  cors_extra_allow_origins: []
  cors_allow_origin_regex: "https?://((localhost|127\\.0\\.0\\.1)(:\\d+)?|[a-z0-9-]+\\.(ngrok-free\\.app|ngrok\\.app))$"

logging:
  level: "INFO"
  format: "dev"            # dev | json
  verbose_context: false

auth:
  skip_auth: true           # local/dev only; production ignores unsafe bypass
  allow_insecure_skip_auth: false
  dev_user_id: "a0778b19-548f-47df-8413-296307566d0f"
  auth_frame_timeout_s: 5.0
  auth_frame_timeout_skip_auth_s: 5.0

session:
  ttl_seconds: 1500
  profile_load_timeout_s: 2.0
  daily_chat_limit: 40
  dev_daily_chat_limit: 1000

redis:
  keyspace_required: true
  # auto | listener | sweep — Upstash/managed Redis: prefer sweep (env REDIS_KEYSPACE_MODE)
  keyspace_mode: auto
  session_lock_ttl_s: 60

supabase:
  # Non-secret project URL. You may also override with SUPABASE_URL.
  url: ""

qdrant:
  url: "http://localhost:6333"
  episodic_collection: "episodic_memories"
  kb_collection: "knowledge_base"

providers:
  primary: "azure"
  chain: "azure,groq"
  llm_generation_timeout_s: 25.0
  safety_gate_timeout_s: 10.0

  azure_openai:
    endpoint: ""
    deployment_name: "gpt-5-mini"
    api_version: "2025-01-01-preview"
    timeout_s: 15.0
    # Leave blank to auto-detect from deployment name.
    # Valid overrides: gpt5_reasoning | classic
    model_family: ""
    reasoning_effort: "low"
    max_completion_tokens: 1600

  groq:
    signal_model: "llama-3.1-8b-instant"
    safety_model: "llama-3.1-8b-instant"
    fallback_model: "llama-3.3-70b-versatile"
    timeout_s: 4.0
    signal_extraction_timeout_s: 6.0

  gemini:
    model: "gemini-1.5-flash"

  glm:
    api_base: "https://open.bigmodel.cn/api/paas/v4/"
    model: "glm-4-flash"
    timeout_s: 6.0

speech:
  azure_region: "eastasia"
  azure_token_ttl_s: 540
  transcribe_timeout_s: 15.0
  transcribe_max_audio_bytes: 6291456
  transcribe_concurrency_limit: 2

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  cache_ttl_s: 3600
  pool_workers: 2
  timeout_s: 4.0
  memory_retrieval_timeout_s: 2.0

budgets:
  max_tokens_per_turn: 8000
  daily_azure_token_budget: 5000000

safety:
  crisis_hardcoded_en: |
    I'm really glad you said that — and I'm worried about you right now. Please reach out tonight:

    iCall: 9152987821
    Vandrevala Foundation: 1860-2662-345

    You don't have to do this alone. If you're in immediate danger please call 112 or go to the nearest emergency room. I'm here when you get back.
  crisis_hardcoded_hi: |
    मुझे तुम्हारी फिक्र है। कृपया अभी किसी से बात करो:

    iCall: 9152987821
    Vandrevala Foundation: 1860-2662-345

    अगर तुम्हें तुरंत मदद चाहिए तो 112 पर कॉल करो या सबसे नज़दीकी अस्पताल जाओ। जब तुम वापस आओगे, मैं यहीं हूँ।

monitoring:
  posthog_host: "https://app.posthog.com"
  sentry_traces_sample_rate: 0.05

features:
  psychoeducation_mode: false
  skill_coach_mode: false
  counsellor_dashboard: false

debug:
  routes_enabled: false

therapist_bridge:
  blocking_timeout_s: 8.0
