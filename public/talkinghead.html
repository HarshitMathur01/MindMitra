<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>MindMitra Avatar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        #avatar {
            display: block;
            width: 100%;
            height: 100%;
        }

        #status {
            display: none;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 4px 12px;
            border-radius: 9999px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            white-space: nowrap;
            z-index: 10;
        }

        #status.visible {
            display: block;
        }
    </style>

    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "talkinghead": "/talkinghead/modules/talkinghead.mjs"
    }
  }
  </script>

    <script type="module">
        import { TalkingHead } from "talkinghead";

        // -- Config from URL params --------------------------------------------------------
        const params = new URLSearchParams(window.location.search);
        const googleKey  = params.get("googleKey")  || "";
        const ttsVoice   = params.get("ttsVoice")   || "en-IN-Neural2-A";  // Indian English female, Neural2
        const ttsLang    = params.get("ttsLang")    || "en-IN";
        const avatarUrl  = params.get("avatarUrl")  || "/talkinghead/avatars/Brunette.glb";

        // ── TTS endpoint selection ────────────────────────────────────────────────────────
        //
        // Google Cloud TTS v1beta1 supports `enableTimePointing` which makes TalkingHead
        // return REAL word timestamps (not estimated). This is the key to accurate lipsync:
        // each word's viseme window is anchored to the exact acoustic onset in the audio.
        //
        // When no Google key is provided, a sentinel endpoint + fetch interceptor is used.
        // TalkingHead runs text-based lipsync; Web Speech API handles audio.
        const GOOGLE_TTS_ENDPOINT = "https://texttospeech.googleapis.com/v1beta1/text:synthesize";
        const SENTINEL_ENDPOINT   = "https://eu-texttospeech.googleapis.com/v1beta1/text:synthesize";

        const ttsEndpoint = googleKey ? GOOGLE_TTS_ENDPOINT : SENTINEL_ENDPOINT;
        const ttsApikey   = googleKey ? googleKey           : "";
        const TTS_MODE    = googleKey ? "google-cloud-tts"  : "webspeech-fallback";

        console.info(
            `%c[MindMitra Avatar] Startup%c\n` +
            `  TTS mode    : ${TTS_MODE}\n` +
            `  Google key  : ${googleKey ? googleKey.slice(0,8) + "…(" + googleKey.length + " chars)" : "NOT SET — using Web Speech fallback"}\n` +
            `  Voice       : ${ttsVoice}\n` +
            `  Avatar URL  : ${avatarUrl}`,
            "background:#0d1117;color:#58c4dc;font-weight:bold",
            "background:#0d1117;color:#e2e8f0"
        );

        // ── "No-key" fallback intercept ───────────────────────────────────────────────────
        // Intercept sentinel calls → return empty 200 so TalkingHead skips audio but still
        // runs its lipsync animation queue. Web Speech API handles audio separately.
        if (!googleKey) {
            const _origFetch = window.fetch.bind(window);
            window.fetch = async function patchedFetch(input, init) {
                const url = typeof input === "string" ? input : input?.url;
                if (url && url.startsWith(SENTINEL_ENDPOINT)) {
                    return new Response(
                        JSON.stringify({}),
                        { status: 200, headers: { "Content-Type": "application/json" } }
                    );
                }
                return _origFetch(input, init);
            };
        }

        // ── Helpers ──────────────────────────────────────────────────────────────────────

        /**
         * Strip common Markdown formatting so TTS does not say symbols aloud.
         * e.g. "**bold**" → "bold", "# Heading" → "Heading"
         */
        function stripMarkdown(text) {
            return text
                .replace(/\*\*(.+?)\*\*/gs, "$1")       // **bold**
                .replace(/\*(.+?)\*/gs, "$1")            // *italic*
                .replace(/__(.+?)__/gs, "$1")            // __bold__
                .replace(/_(.+?)_/gs, "$1")              // _italic_
                .replace(/~~(.+?)~~/gs, "$1")            // ~~strikethrough~~
                .replace(/`{1,3}[^`]*`{1,3}/g, "")       // `code` / ```block```
                .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1") // [link](url)
                .replace(/^#+\s+/gm, "")                 // # Headings
                .replace(/^[-*+]\s+/gm, "")              // - bullet points
                .replace(/^\d+\.\s+/gm, "")              // 1. numbered lists
                .replace(/\n{3,}/g, "\n\n")              // collapse excess blank lines
                .trim();
        }

        /** Decode a base64 string (Google TTS audioContent) to an ArrayBuffer. */
        function b64ToArrayBuffer(b64) {
            const bin = atob(b64);
            const buf = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
            return buf.buffer;
        }

        /** XML-escape a word so it is safe inside an SSML <speak> element. */
        function escapeXml(t) {
            return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
        }

        /**
         * Make ONE Google TTS v1beta1 request for all words.
         * Returns { audioContent, timepoints, words } or null on error.
         *
         * SSML mark strategy:
         *   word0 <mark name='1'/> word1 <mark name='2'/> word2 …
         * Mark i fires at the acoustic ONSET of word i+1, so:
         *   wtimes[0] = 0
         *   wtimes[i] = timepoints[i-1].timeSeconds * 1000  (i > 0)
         */
        async function fetchGoogleTTS(words) {
            let ssml = "<speak>";
            words.forEach((w, i) => {
                if (i > 0) ssml += " <mark name='" + i + "'/> ";
                ssml += escapeXml(w);
            });
            ssml += "</speak>";

            // Map TalkingHead's internal encoding name to the Google API value.
            const encMap = { "OGG-OPUS": "OGG_OPUS", "MP3": "MP3" };
            const audioEncoding = encMap[head.ttsAudioEncoding] || "MP3";

            try {
                const resp = await fetch(
                    "https://texttospeech.googleapis.com/v1beta1/text:synthesize?key=" + googleKey,
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json; charset=utf-8" },
                        body: JSON.stringify({
                            input: { ssml },
                            voice: { languageCode: ttsLang, name: ttsVoice },
                            audioConfig: { audioEncoding, speakingRate: 0.9, pitch: 2.0 },
                            enableTimePointing: [1]
                        })
                    }
                );
                if (!resp.ok) {
                    console.error("[MindMitra Avatar] Google TTS HTTP " + resp.status);
                    return null;
                }
                const data = await resp.json();
                return { audioContent: data.audioContent, timepoints: data.timepoints || [], words };
            } catch (err) {
                console.error("[MindMitra Avatar] Google TTS fetch error:", err);
                return null;
            }
        }

        /**
         * Convert Google TTS timepoints to TalkingHead's wtimes / wdurations arrays.
         * All values are in absolute milliseconds from the start of the audio buffer.
         *
         * wtimes[0]  = 0          (first word always starts at 0)
         * wtimes[i]  = timepoints[i-1].timeSeconds * 1000  (i > 0)
         * wdurations[i] = wtimes[i+1] − wtimes[i]  (last word fills to audioDurationMs)
         */
        function buildWordTimingsFromTimepoints(words, timepoints, audioDurationMs) {
            const wtimes = [];
            const wdurations = [];
            for (let i = 0; i < words.length; i++) {
                const tMs = i === 0
                    ? 0
                    : ((timepoints[i - 1]?.timeSeconds ?? (wtimes[i - 1] / 1000)) * 1000);
                wtimes.push(Math.round(tMs));
            }
            for (let i = 0; i < words.length; i++) {
                const next = i + 1 < words.length ? wtimes[i + 1] : audioDurationMs;
                wdurations.push(Math.max(50, next - wtimes[i]));
            }
            return { words, wtimes, wdurations };
        }

        // ── TalkingHead init ─────────────────────────────────────────────────────────────
        let head = null;
        const statusEl = document.getElementById("status");

        function setStatus(msg) {
            statusEl.textContent = msg || "";
            statusEl.classList.toggle("visible", !!msg);
        }

        function postToParent(data) {
            window.parent.postMessage(data, "*");
        }

        async function init() {
            setStatus("Loading avatar\u2026");
            console.info("[MindMitra Avatar] Loading model: " + avatarUrl);

            head = new TalkingHead(document.getElementById("avatar"), {
                // Real Google TTS endpoint when key is present → word timestamps → perfect lipsync.
                // Sentinel endpoint when absent → intercepted → empty response.
                ttsEndpoint: ttsEndpoint,
                ttsApikey:   ttsApikey,
                lipsyncModules: ["en"],
                cameraView: "mid",
            });

            try {
                await head.showAvatar(
                    {
                        url: avatarUrl,
                        body: "F",
                        avatarMood: "neutral",
                        ttsLang:  ttsLang,
                        ttsVoice: ttsVoice,
                        // ttsRate maps to Google speakingRate (0.25–4.0). 0.9 = slightly slower.
                        ttsRate:  0.9,
                        // ttsPitch maps to Google pitch in semitones (-20 to +20). +2 = gentle warmth.
                        ttsPitch: 2,
                        lipsyncLang: "en",
                    },
                    (ev) => {
                        if (ev.lengthComputable) {
                            const pct = Math.min(100, Math.round((ev.loaded / ev.total) * 100));
                            setStatus("Loading " + pct + "%");
                        }
                    }
                );
                setStatus(null);
                console.info("[MindMitra Avatar] ✅ Avatar ready — TTS mode: " + TTS_MODE);
                postToParent({ type: "ready" });
            } catch (err) {
                console.error("[MindMitra Avatar] ❌ Avatar load error:", err);
                setStatus("Failed to load avatar");
                postToParent({ type: "error", message: err.toString() });
            }
        }

        // ── Web Speech API fallback (used when no Google key) ───────────────────────────
        function speakWithWebSpeech(text) {
            if (!window.speechSynthesis) return false;
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang  = ttsLang || "en-IN";
            utter.rate  = 0.9;
            utter.pitch = 1.05;
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v =>
                v.lang.startsWith("en") && /female|woman|zira|emma|aria|susan|hazel|karen/i.test(v.name)
            ) || voices.find(v => v.lang.startsWith("en"));
            if (femaleVoice) utter.voice = femaleVoice;
            utter.onend   = () => { clearSpeakEndPoll(); postToParent({ type: "speakingEnd" }); };
            utter.onerror = () => { clearSpeakEndPoll(); postToParent({ type: "speakingEnd" }); };
            window.speechSynthesis.speak(utter);
            return true;
        }

        // ── Resume AudioContext on first user interaction (browser autoplay policy) ──────
        let audioResumed = false;
        async function ensureAudioCtx() {
            if (audioResumed) return;
            if (head?.audioCtx?.state === "suspended") {
                try { await head.audioCtx.resume(); audioResumed = true; } catch { /* noop */ }
            }
        }
        document.addEventListener("click",       ensureAudioCtx);
        document.addEventListener("pointerdown", ensureAudioCtx);

        // ── Speech-end detection poll ────────────────────────────────────────────────────
        let speakEndPoll = null;

        function clearSpeakEndPoll() {
            if (speakEndPoll !== null) { clearInterval(speakEndPoll); speakEndPoll = null; }
        }

        function startSpeakEndPoll() {
            clearSpeakEndPoll();
            let ticks = 0;
            speakEndPoll = setInterval(() => {
                ticks++;
                if (ticks > 3 && !head.isSpeaking && head.speechQueue.length === 0) {
                    clearSpeakEndPoll();
                    postToParent({ type: "speakingEnd" });
                }
            }, 250);
        }

        // ── PostMessage bridge (React ↔ iframe) ──────────────────────────────────────────
        window.addEventListener("message", async (event) => {
            if (!head) return;
            const { type, text, mood } = event.data || {};

            switch (type) {
                case "speakText":
                    if (!text) break;
                    console.log("[MindMitra Avatar] speakText (" + text.length + " chars) | TTS: " + TTS_MODE);
                    try {
                        await ensureAudioCtx();
                        clearSpeakEndPoll();
                        const cleanText = stripMarkdown(text);

                        if (googleKey) {
                            // ── Single-fetch speakAudio() path: zero inter-sentence pauses ──
                            // We make ONE Google TTS call for the entire response text.
                            // This gives us a single AudioBuffer + real per-word timestamps
                            // (timepoints[i].timeSeconds). speakAudio() hands it all to
                            // TalkingHead in one shot — no sentence-boundary queuing, no gaps.
                            const plainWords = cleanText.split(/\s+/).filter(w => w.length > 0);
                            const result = await fetchGoogleTTS(plainWords);
                            if (result) {
                                const arraybuf = b64ToArrayBuffer(result.audioContent);
                                const audioBuffer = await head.audioCtx.decodeAudioData(arraybuf);
                                const { words, wtimes, wdurations } = buildWordTimingsFromTimepoints(
                                    result.words, result.timepoints, audioBuffer.duration * 1000
                                );
                                console.log("[MindMitra Avatar] speakAudio → " + words.length + " words, " + audioBuffer.duration.toFixed(2) + "s");
                                head.speakAudio({ audio: audioBuffer, words, wtimes, wdurations });
                                postToParent({ type: "speakingStart" });
                                startSpeakEndPoll();
                            } else {
                                // Fallback: speakText has sentence pauses but better than silence.
                                head.speakText(cleanText);
                                postToParent({ type: "speakingStart" });
                                startSpeakEndPoll();
                            }
                        } else {
                            // ── No-key fallback: lipsync queue + Web Speech audio ─────────
                            head.speakText(cleanText); // queues lipsync animations (no audio from TH)
                            postToParent({ type: "speakingStart" });
                            const fireWebSpeech = () => speakWithWebSpeech(cleanText);
                            if (window.speechSynthesis.getVoices().length === 0) {
                                window.speechSynthesis.addEventListener("voiceschanged", fireWebSpeech, { once: true });
                            } else {
                                fireWebSpeech();
                            }
                            startSpeakEndPoll();
                        }
                    } catch (err) {
                        console.error("[MindMitra Avatar] ❌ speakText error:", err);
                    }
                    break;

                case "stopSpeaking":
                    console.log("[MindMitra Avatar] stopSpeaking");
                    clearSpeakEndPoll();
                    if (!googleKey && window.speechSynthesis) window.speechSynthesis.cancel();
                    try { head.stopSpeaking(); postToParent({ type: "speakingEnd" }); } catch { /* noop */ }
                    break;

                case "setMood":
                    if (mood) {
                        console.log("[MindMitra Avatar] setMood → " + mood);
                        try { head.setMood(mood); } catch { /* noop */ }
                    }
                    break;

                case "pause":
                    try { head.stop(); } catch { /* noop */ }
                    break;

                case "resume":
                    try { head.start(); } catch { /* noop */ }
                    break;
            }
        });

        document.addEventListener("visibilitychange", () => {
            if (!head) return;
            document.visibilityState === "visible" ? head.start() : head.stop();
        });

        document.addEventListener("DOMContentLoaded", init);
    </script>
</head>

<body>
    <div id="avatar"></div>
    <div id="status"></div>
</body>

</html>
