<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════
         Favicon & App Icons
    ═══════════════════════════════════════ -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- ══════════════════════════════════════
         Primary Meta
    ═══════════════════════════════════════ -->
    <title>MindMitra — Your AI Mental Health Companion</title>
    <meta name="description" content="MindMitra is an AI-powered mental health companion offering 24/7 personalised emotional support through a conversational chatbot and 3D avatar. A bridge between you and professional care — anytime, stigma-free." />
    <meta name="keywords" content="mental health, AI companion, emotional support, therapy, chatbot, student mental health, anxiety, depression support, MindMitra, 3D avatar, Avatar" />
    <meta name="author" content="MindMitra" />
    <meta name="theme-color" content="#FAF9F6" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://mindmitra.co.in/" />

    <!-- ═══════════════════════════════════════
         Open Graph (WhatsApp, Facebook, LinkedIn)
    ═══════════════════════════════════════ -->
    <meta property="og:title" content="MindMitra — Your AI Mental Health Companion" />
    <meta property="og:description" content="Personalised, memory-driven emotional support through AI — a bridge to professional care, not a replacement. Available 24/7 for personalised emotional support." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mindmitra.co.in/" />
    <meta property="og:image" content="https://mindmitra.co.in/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="MindMitra — A quiet companion for the loud days." />
    <meta property="og:site_name" content="MindMitra" />
    <meta property="og:locale" content="en_IN" />

    <!-- ═══════════════════════════════════════
         Twitter / X
    ═══════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MindMitra — Your AI Mental Health Companion" />
    <meta name="twitter:description" content="A bridge to professional care, not a replacement. Personalised, memory-driven emotional support — available 24/7." />
    <meta name="twitter:image" content="https://mindmitra.co.in/og-default.png" />

    <!-- ═══════════════════════════════════════
         Fonts — Site defaults + MindGym (scoped)
    ═══════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Devanagari support for Hindi copy that already appears in modals & disclaimers. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Sanctuary fonts — used only by the post-login scenic landing (SanctuaryHome). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <!-- ═══════════════════════════════════════
         Base Styles — smooth scroll + font
    ═══════════════════════════════════════ -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #FAF9F6;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Page load fade-in */
      #root {
        animation: pageLoad 0.5s ease-in-out;
      }
      @keyframes pageLoad {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0);   }
      }
    </style>

    <!-- ═══════════════════════════════════════
         Structured Data (Google Rich Results)
    ═══════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "MindMitra",
      "url": "https://mindmitra.co.in",
      "description": "AI-powered mental health companion providing personalised emotional support through conversational AI and 3D avatar for students and young adults.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "INR"
      },
      "creator": {
        "@type": "Organization",
        "name": "MindMitra",

      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

  </body>
</html>
