# ╔══════════════════════════════════════════════════════════════╗
# ║  MindMitra Configuration File                                ║
# ║  Modify this file to change system behavior without          ║
# ║  touching the source code.                                   ║
# ╚══════════════════════════════════════════════════════════════╝

# ──────────────────────────────────────────────────────────────
# 1. API KEYS (Can also be set via environment variables)
# ──────────────────────────────────────────────────────────────
api_keys:
  # If not set here, will read from environment variables
  groq_api_key: ${GROQ_API_KEY}
  zai_api_key: ${ZAI_API_KEY}          # ZhipuAI / GLM key (was ZHIPUAI_API_KEY)
  google_api_key: ${GOOGLE_API_KEY}
  supabase_url: ${SUPABASE_URL}
  supabase_key: ${SUPABASE_KEY}
  azure_api_key: ${AZURE_API_KEY}

# ──────────────────────────────────────────────────────────────
# 2. LOGGING CONFIGURATION
# ──────────────────────────────────────────────────────────────
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  # compact format: HH:MM:SS L <message>  (configured in app/core/logging.py)

# ──────────────────────────────────────────────────────────────
# 3. NLP MODULE (GROQ) CONFIGURATION
# ──────────────────────────────────────────────────────────────
nlp_module:
  enabled: true
  model: "qwen/qwen3-32b"  # Options: qwen/qwen3-32b, meta-llama/llama-4-scout-17b-16e-instruct
  temperature: 0.1
  max_tokens: 400
  
  # Model token limits (for automatic truncation)
  model_token_limits:
    "qwen/qwen3-32b": 4096
    "moonshotai/kimi-k2-instruct-0905": 4096
    "meta-llama/llama-4-scout-17b-16e-instruct": 8192

# ──────────────────────────────────────────────────────────────
# 4. GLM CONTROLLER CONFIGURATION (ZhipuAI)
# ──────────────────────────────────────────────────────────────
glm_controller:
  model: "glm-4-32b-0414-128k"  # Main model for psychology agents
  max_concurrent: 3  # Number of concurrent GLM calls
  max_retries: 2  # Retry attempts on failure
  base_backoff: 2.0  # Exponential backoff base (seconds)
  temperature: 0.55        # Default / Path C (therapeutic) — warm but coherent
  top_p: 0.85
  # max_tokens: 1000  # Commented out to let model decide
  temperature_path_a: 0.75  # Path A casual — more creative, personality-forward
  temperature_path_b: 0.62  # Path B emotional — warmer and natural, not clinical
  # Path C/D use default temperature: 0.55

  # Enable Groq fallback for GLM failures
  groq_fallback_enabled: false

# ──────────────────────────────────────────────────────────────
# 5. AZURE OPENAI CONTROLLER CONFIGURATION
# ──────────────────────────────────────────────────────────────
azure_controller:
  model: "gpt-5-mini"
  base_url: "https://claudee.openai.azure.com/openai/v1"
  reasoning:
    effort: low
  max_concurrent: 3
  max_retries: 2
  base_backoff: 2.0
  max_tokens: 3000          # gpt-5-mini is a reasoning model — needs 1500+ tokens for reasoning before output
  temperature: 0.55        # Default / Path C (therapeutic) — warm but coherent
  top_p: 0.85
  temperature_path_a: 0.75  # Path A casual — more creative, personality-forward
  temperature_path_b: 0.62  # Path B emotional — warmer and natural, not clinical

# ──────────────────────────────────────────────────────────────
# 6. SCREENING ASSESSMENTS (PHQ-9 / GAD-7)
# ──────────────────────────────────────────────────────────────
screening_assessments:
  enabled: true
  groq_model: "llama-3.3-70b-versatile"
  temperature: 0.0
  max_tokens: 280

# ──────────────────────────────────────────────────────────────
# 7. MEMORY SYSTEM (mem0 + Qdrant)
# ──────────────────────────────────────────────────────────────
memory:
  # Qdrant connection — override via env vars QDRANT_HOST / QDRANT_PORT / QDRANT_COLLECTION
  qdrant_host: "localhost"
  qdrant_port: 6333
  collection: "companion_memories"
  # LLM: Groq llama-3.3-70b-versatile (fact extraction)
  # Embedder: sentence-transformers/all-MiniLM-L6-v2 (local, 384-dim, no API cost)
  # Init runs in a background daemon thread — never blocks server startup
  retrieval_limit: 5  # max memories returned per query

# ──────────────────────────────────────────────────────────────
# 10. RESPONSE GENERATOR CONFIGURATION
# ──────────────────────────────────────────────────────────────
response_generator:
  llm_provider: "azure"  # Options: "glm" | "azure"

  # Recent conversation context
  recent_messages_count: 3

  # Memory context
  max_memories_per_type: 3
  
  # System prompt is defined in response_agent.py (the config default below is a fallback)
  # The actual prompt includes Magnetic Companion Rules, question budget, stage directives, etc.
  # See response_agent.py BASE_SYSTEM_PROMPT for the authoritative version.

# ──────────────────────────────────────────────────────────────
# 11. WORKFLOW ORCHESTRATION
# ──────────────────────────────────────────────────────────────
workflow:
  # Parallel processing
  max_workers: 3  # For concurrent memory/NLP/cultural analysis
  
  # Context merge strategy
  merge_strategy: "llm"  # Options: "simple" or "llm"
  merge_with_groq: true  # Use Groq for merge (faster/cheaper than GLM)
  
  # Background summarization
  summarization:
    enabled: true
    interval: 12  # Summarize every N messages
    cache_enabled: true

# ──────────────────────────────────────────────────────────────
# 12. FEATURE FLAGS
# ──────────────────────────────────────────────────────────────
features:
  # Enable/disable major features
  nlp_analysis: true
  cultural_context: true
  screening_assessments: true
  voice_analysis_support: true
  
  # Database persistence
  save_to_supabase: true
  user_contexts_table: true  # Save full context to user_contexts table
  
  # Performance optimizations
  parallel_processing: true
  context_caching: true

# ──────────────────────────────────────────────────────────────
# 13. PERFORMANCE TUNING
# ──────────────────────────────────────────────────────────────
performance:
  # Context window limits (characters)
  max_user_message_length: 2000
  max_history_snippet_length: 1000
  max_memory_content_length: 150
  
  # Timeout settings (seconds)
  groq_timeout: 30
  glm_timeout: 60
  memory_retrieval_timeout: 10
  
  # Rate limiting
  requests_per_minute: 60
  burst_limit: 10

# ──────────────────────────────────────────────────────────────
# 14. DEBUGGING & DEVELOPMENT
# ──────────────────────────────────────────────────────────────
debug:
  # Print prompts to console
  print_prompts: false
  
  # Save prompts to files
  save_prompts: false
  prompts_dir: "debug/prompts"
  
  # Detailed timing logs
  log_timing: true
  
  # Skip LLM calls (for testing)
  mock_llm_responses: false