  <!-- ═══════════════════════════════════════
         Theme — resolved before first paint
    ═══════════════════════════════════════ -->
  <script>
    /* Must stay blocking and must stay here, above every stylesheet.
       ThemeContext used to resolve the theme in an effect, which meant the
       first frame was always light: a dark-mode user watched a white page for
       as long as the JS graph took to arrive, then had it swapped underneath
       them. Reading the same key here costs one synchronous localStorage hit.

       The precedence is ThemeContext's, exactly: an explicit saved choice wins
       over the OS, 'system' defers to the OS, and anything else — including a
       first visit — is light. Keep the two in step; ThemeContext seeds its
       state from the attribute this sets. */
    (function () {
      try {
        var saved = localStorage.getItem('mindmitra-theme');
        var theme = saved === 'dark' || saved === 'light' ? saved
          : saved === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        /* Storage blocked (private mode). Light is the documented default. */
      }
    })();
  </script>

  <!-- ONE render-blocking request for every face the app can show above the
       fold. This was five separate stylesheets; each one was a render-blocking
       resource in its own right, and the browser will not paint until the last
       of them lands.

       Families, and who needs them — do not drop one without checking:
         Kalam ................. body default (index.css --font-sans)
         Caveat ................ --font-display / --font-script / --font-serif
         Fraunces .............. .serif-display, shared app + landing
         DM Serif Display ...... globals.css headings
         Plus Jakarta Sans ..... globals.css UI
         Noto Sans Devanagari .. Hindi copy in modals & disclaimers
         Tiro / Mukta / Libre Baskerville / IBM Plex Sans .. public landing
         Dancing Script ........ legacy --font-fancy token
         Work Sans ............. Night River --font-nr-sans (ALSO CampusChess,
                                 which is why it lives here and not below)
         Instrument Serif ...... Night River headlines, italic only — the
                                 roman is not requested, the italic is the
                                 design's signature -->
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Serif+Display&family=Dancing+Script:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Kalam:wght@300;400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Mukta:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&family=Work+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Shippori Mincho B1 + JetBrains Mono — CampusChess and BuddyTicTacToe
       only, both lazily-routed MindGym tools.

       Deliberately NOT render-blocking. Shippori Mincho B1 is a Japanese
       serif: Google splits it into hundreds of unicode-range subsets and the
       @font-face block alone is 345 KB (~90 KB gzipped). It was sitting in
       front of first paint on every route in the app — the landing, chat,
       the home screen — to serve two games most users never open. The actual
       font files were never downloaded there; the CSS describing them was.

       `media="print"` makes the browser fetch it at low priority without
       blocking render; the onload flip applies it once it arrives. On the two
       tool pages that use it the faces are in place long before a lazy route
       chunk finishes, and `display=swap` covers the case where they aren't. -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap" />
  </noscript>

  <!-- ═══════════════════════════════════════
         Base Styles — smooth scroll + font
    ═══════════════════════════════════════ -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Kalam', 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #FAF9F6;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Paired with the theme script at the top of <head>. Without this the
       pre-React frame is #FAF9F6 for everyone, so a dark-mode user gets a
       full white screen for the whole of the load and then a hard cut to
       dark. Values are index.css's --ink-0 / --foreground for the dark
       theme, resolved to hex — this is the only place they can't be a
       custom property, because index.css has not loaded yet. */
    html[data-theme="dark"] body {
      background-color: #111318;
      color: #e0dbd2;
    }

    /* Page load fade-in */
    #root {
      animation: pageLoad 0.5s ease-in-out;
    }

    @keyframes pageLoad {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* This one predates the app's motion gating and so was invisible to
       usePrefersReducedMotion — it runs before any JS. Gate it here. */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      #root {
        animation: none;
      }
    }
  </style>
